# Included by devcontainer.json after the base Compose configuration.
services:
  frappe:
    environment:
      FRAPPE_DEV_AGENTS: "1"
      COMPOSE_PROJECT_NAME: ${COMPOSE_PROJECT_NAME}
      FRAPPE_APPS_JSON: ${FRAPPE_APPS_JSON:-apps-example.json}
      FRAPPE_BENCH_NAME: ${FRAPPE_BENCH_NAME:-frappe-bench}
      FRAPPE_SITE_NAME: ${FRAPPE_SITE_NAME:-development.localhost}
      CODEX_HOME: /home/frappe/.codex
      T3CODE_HOME: /home/frappe/.t3
      GH_CONFIG_DIR: /home/frappe/.config/gh
      GLAB_CONFIG_DIR: /home/frappe/.config/glab-cli
    volumes:
      - codex-data:/home/frappe/.codex
      - t3-data:/home/frappe/.t3
      - github-cli-data:/home/frappe/.config/gh
      - gitlab-cli-data:/home/frappe/.config/glab-cli
    ports:
      - "127.0.0.1:${FRAPPE_T3_PORT:-3774}:3773"

# Compose scopes these volumes to the project; each stack keeps its own state.
volumes:
  codex-data:
  t3-data:
  github-cli-data:
  gitlab-cli-data:
