# Optional: seed an empty container auth cache from an existing host login.
services:
  frappe:
    volumes:
      - type: bind
        source: ${FRAPPE_CODEX_AUTH_FILE:?Set FRAPPE_CODEX_AUTH_FILE to an existing auth.json}
        target: /run/frappe-codex-auth.json
        read_only: true
        bind:
          create_host_path: false
